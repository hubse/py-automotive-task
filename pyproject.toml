[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "order-automation"
version = "0.1.0"
description = "Automated order processing and reporting application"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]


[project.scripts]
order-automation = "order_automation.main:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.mypy]
python_version = "3.11"
strict = true

